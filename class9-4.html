<!DOCTYPE html>
<html>
<head>
    <title>Class9-4</title>
    <style>
        #text{
              text-shadow: 2px 2px 2px rgb(38, 148, 84) ;
        }
        #box{
            box-shadow: 9px 9px 5px rgb(192, 29, 29);
        }
        #indent{
            text-indent: 50%; 
        }
    </style>
</head>
<body>
    <h1 id="text">We can use text-shadow to text itself</h1>


    <h1 id="box">Or use box-shadow to give shadow to the element</h1>


    <div>
         <p>Text-indent</p>
         <p id="indent">Example of text-indent</p>
    </div>
</body>
</html>
